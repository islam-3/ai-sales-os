name: Live smoke test

# Triggered by Vercel telling GitHub a deployment finished — NOT by push.
#
# On push the new build is still compiling, so the job would hold a
# conversation with the PREVIOUS deployment and then pass or fail for
# code that is not the code being tested. deployment_status fires once
# the new version is actually serving traffic, which is the only moment
# this test means anything.
on:
  deployment_status:

jobs:
  smoke:
    # Production successes only. Vercel also emits this event for preview
    # deployments and for pending/error states, and a preview URL may sit
    # behind deployment protection that would fail the request for
    # reasons unrelated to the code.
    if: >-
      github.event.deployment_status.state == 'success' &&
      github.event.deployment_status.environment == 'Production'

    runs-on: ubuntu-latest
    timeout-minutes: 25

    # deployments:read is for the scope check below, which asks what the
    # last successful production deployment was. If it is ever denied,
    # that check falls back to running the test rather than skipping it.
    permissions:
      contents: read
      deployments: read

    # One run at a time, and never cancelled halfway: an interrupted run
    # leaves half a conversation in the test tenant and proves nothing.
    concurrency:
      group: smoke-test
      cancel-in-progress: false

    steps:
      # Full history: the scope check below diffs this deployment
      # against the last one, which can be many commits back.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── Does this deployment change anything production SERVES? ────
      #
      # Six conversations of seven turns is ~$0.49 of Anthropic, and it
      # ran 14 times in the fortnight to 2026-10-19 for $6.80 — 77% of
      # everything test-clinic spent (scripts/report-smoke-cost.ts). One
      # of those runs was a README-only commit, which could not have
      # found anything.
      #
      # `paths:` is not available here: this job triggers on
      # deployment_status, not on push, for the reason at the top of the
      # file. So the diff is computed against the previous successful
      # production deployment — not against the parent commit, which
      # would miss everything else in the same push.
      #
      # It FAILS TOWARD RUNNING. No previous deployment, an unrelated
      # history, a failed API call, an unreadable diff: run the test.
      # The cost of a skip that should have run is a broken deployment
      # nobody notices, and graceful degradation means nobody would —
      # which is the whole reason the degraded-chat alert is a launch
      # blocker in README.md.
      - name: Does this deployment change anything production serves?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.deployment.sha }}
        run: |
          set -u
          previous=""
          # Deployments come back newest first. Take the newest one that
          # is not this commit and did actually succeed.
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=Production&per_page=30" \
                         --jq '.[].sha' 2>/dev/null || true); do
            [ "$sha" = "$SHA" ] && continue
            id=$(gh api "repos/${{ github.repository }}/deployments?environment=Production&sha=$sha&per_page=1" \
                   --jq '.[0].id' 2>/dev/null || true)
            [ -z "$id" ] && continue
            state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses?per_page=10" \
                      --jq '[.[].state] | index("success")' 2>/dev/null || true)
            if [ -n "$state" ] && [ "$state" != "null" ]; then previous="$sha"; break; fi
          done

          if [ -z "$previous" ]; then
            echo "No previous successful production deployment to compare against — running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! git cat-file -e "$previous^{commit}" 2>/dev/null; then
            echo "Previous deployment $previous is not in this history — running."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          changed=$(git diff --name-only "$previous" "$SHA" || true)
          if [ -z "$changed" ]; then
            echo "Empty diff against $previous — running rather than guessing."
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "Changed since $previous:"; echo "$changed" | sed 's/^/  /'

          # Everything the deployment actually serves. scripts/ and docs/
          # are absent on purpose: a measurement script or a case list
          # cannot change what a visitor gets. supabase/ IS here — a
          # migration changes what the route reads.
          if echo "$changed" | grep -qE '^(app/|lib/|components/|public/|supabase/|middleware\.|next\.config|package(-lock)?\.json|tsconfig\.json)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Smoke test running::This deployment changes what production serves."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Smoke test skipped::Nothing under app/ lib/ components/ public/ supabase/ changed since $previous, so there is nothing a conversation could find. Saved ~\$0.49."
          fi

      # 24, matching the machine this suite is verified on.
      #
      # Node 20 here cost four failed runs: @supabase/supabase-js needs a
      # global WebSocket, which did not exist before Node 22, so the
      # script died on import with "native WebSocket not found" while the
      # identical command passed locally on 24. A CI runtime older than
      # the development one turns every version-sensitive dependency into
      # a failure that cannot be reproduced where it is being debugged.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.run == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.scope.outputs.run == 'true'

      # Belt and braces, in shell, so the answer appears even if the
      # script cannot start at all. Annotations are readable without admin
      # rights on the repository; workflow logs are not, which is why two
      # failed runs said nothing more than "exit code 2".
      #
      # Presence only — never a value, never a length.
      - name: Check configuration
        if: steps.scope.outputs.run == 'true'
        env:
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: |
          missing=""
          for v in BASE_URL NEXT_PUBLIC_SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY                    NEXT_PUBLIC_SUPABASE_ANON_KEY TEST_OWNER_EMAIL TEST_OWNER_PASSWORD; do
            if [ -z "${!v}" ]; then missing="$missing $v"; else echo "present: $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Smoke test secrets missing::Not set:$missing. If these were added as ENVIRONMENT secrets, this job must declare a matching 'environment:' to see them; repository secrets need no such declaration."
            exit 1
          fi

      - name: Smoke test against production
        if: steps.scope.outputs.run == 'true'
        env:
          # Encrypted repository secrets, never values in this file.
          #
          # Only what the test actually uses:
          #   PRODUCTION_URL          - the deployment to talk to
          #   SUPABASE_URL            - to read back the lead it created
          #   SUPABASE_SERVICE_ROLE_KEY - lead_profile is not readable
          #                             anonymously, and the smoke test
          #                             must confirm the lead was saved
          #
          # The service-role key is the uncomfortable one and it is worth
          # being honest about: it can read every tenant's data, not just
          # the test tenant's. It is here because the assertion that
          # matters most — the name and number actually landed — cannot be
          # made without reading that table. If that ever stops being an
          # acceptable trade, the fix is a narrow read-only endpoint
          # scoped to a test tenant, not a wider key.
          BASE_URL: ${{ secrets.PRODUCTION_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # The dashboard half signs in as a dedicated account that owns
          # ONLY the test tenant, never a real person's. RLS confines it
          # there even if something else goes wrong.
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          TEST_OWNER_EMAIL: ${{ secrets.TEST_OWNER_EMAIL }}
          TEST_OWNER_PASSWORD: ${{ secrets.TEST_OWNER_PASSWORD }}
        run: npx tsx scripts/smoke-test.ts

      - name: Say what failed
        if: failure()
        run: |
          echo "::error::Live smoke test failed against ${{ github.event.deployment_status.environment_url }}"
          echo "The deployment is SERVING. This job does not roll anything back."
          echo "Check the step above for which failure class broke and on which turn."
